<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Servidores</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0f172a;color:#0f172a}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 16px 32px}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0 0 14px}
  .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
  .card small{color:#64748b;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .card b{display:block;font-size:34px;line-height:1.1;margin-top:6px}
  .card span{color:#64748b;font-size:12px}
  .panel{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .panel-head{padding:18px 22px 6px;display:flex;justify-content:space-between;align-items:center}
  .panel-head h2{margin:0;font-size:20px}
  .panel-head span{color:#64748b;font-size:12px}
  table{width:100%;border-collapse:collapse}
  th{background:#eef6f1;text-align:left;padding:12px 22px;font-size:11px;letter-spacing:.08em;color:#475569;text-transform:uppercase}
  td{padding:14px 22px;border-top:1px solid #eef2f7;font-size:14px}
  td.nome{font-weight:700}
  .pill{display:inline-flex;align-items:center;gap:7px;background:#dcfce7;color:#166534;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.red{background:#fee2e2;color:#991b1b}
  .pill.yellow{background:#fef9c3;color:#854d0e}
  .dot{width:9px;height:9px;border-radius:50%;background:#22c55e;display:inline-block}
  .pill.red .dot{background:#ef4444}
  .pill.yellow .dot{background:#eab308}
  .foot{color:#cbd5e1;text-align:center;font-size:12px;margin-top:12px}
  .loading{padding:30px;text-align:center;color:#64748b}
  .erro{padding:20px;text-align:center;color:#991b1b;font-size:13px;line-height:1.6;word-break:break-word}
  .debug{padding:12px 22px;color:#64748b;font-size:11px;word-break:break-word;border-top:1px solid #eef2f7}
  @media(max-width:640px){
    .wrap{padding:12px 10px 20px}
    .cards{grid-template-columns:repeat(2,1fr);gap:10px}
    .card{padding:14px}
    .card b{font-size:28px}
    .panel-head{padding:14px 14px 4px}
    .panel-head h2{font-size:17px}
    th, td{padding:12px 8px;font-size:13px}
    td.col-tipo{font-size:10px;color:#64748b;padding:12px 4px}
    td.col-ip{font-size:12px;color:#475569}
    .pill{padding:5px 9px;font-size:11px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="cards">
    <div class="card"><small>Online</small><b id="online" style="color:#16a34a">-</b><span>Respondendo agora</span></div>
    <div class="card"><small>Offline</small><b id="offline" style="color:#dc2626">-</b><span id="txtOffline">Nenhuma falha</span></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h2>Status dos servidores</h2><span id="sub">-</span></div>
    <div id="tabela"><div class="loading">Carregando dados da planilha...</div></div>
    <div id="debug" class="debug"></div>
  </div>
  <div class="foot">Monitoramento da Rede &bull; Atualiza sozinho a cada 5 minutos</div>
</div>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQEwz5huwO-Na0cbqkcKOP7TobOahY1i1YOXBzGz5UVEccN51CUoi7wDJmEXAiOMoaPN5omjA_kpeGU/pub?gid=828747722&single=true&output=csv";
function encurtarTipo(t){ t=String(t).toUpperCase(); if(t.includes('SERVIDOR')) return 'SERV'; if(t==='PC'||t.includes('PC')) return 'PC'; return t; }
function parseCSV(text){
  const linhas = text.trim().split(/\r?\n/).slice(1).filter(l=>l.trim());
  return linhas.map(l=>{
    const p = l.split(',').map(s=>s.replace(/^"|"$/g,'').trim());
    return {tipo:p[0]||'', nome:p[1]||'', ip:p[2]||'', status:p[3]||''};
  }).filter(d=>d.nome);
}
function mostrar(dados){
  const total = dados.length;
  const online = dados.filter(d=>d.status.toUpperCase().includes('ONLINE') && !d.status.toUpperCase().includes('OFF')).length;
  const offline = dados.filter(d=>d.status.toUpperCase().includes('OFFLINE')).length;
  document.getElementById('online').textContent = online;
  document.getElementById('offline').textContent = offline;
  document.getElementById('txtOffline').textContent = offline === 0 ? 'Nenhuma falha' : offline + ' com falha';
  document.getElementById('sub').textContent = total + ' servidores • 4 colunas';
  let html = '<table><thead><tr><th class="col-tipo">Tipo</th><th>Nome</th><th class="col-ip">IP</th><th>Status</th></tr></thead><tbody>';
  dados.forEach(d=>{
    const s = d.status.toUpperCase();
    let cls='pill', txt='ONLINE';
    if(s.includes('OFFLINE')){ cls+=' red'; txt='OFFLINE'; }
    else if(s.includes('LENTO')){ cls+=' yellow'; txt='LENTO'; }
    html += '<tr><td class="col-tipo">'+encurtarTipo(d.tipo)+'</td><td class="nome">'+d.nome+'</td><td class="col-ip">'+d.ip+'</td><td><span class="'+cls+'"><span class="dot"></span>'+txt+'</span></td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tabela').innerHTML = html;
}
async function tentar(url){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status + ' em ' + url);
  const text = await res.text();
  if(text.trim().startsWith('<')) throw new Error('Retornou HTML em vez de CSV');
  const dados = parseCSV(text);
  if(!dados.length) throw new Error('CSV veio vazio / formato diferente. Inicio: ' + text.slice(0,120));
  return dados;
}
async function carregar(){
  const debug = document.getElementById('debug');
  try{
    debug.textContent = 'Tentando direto...';
    const dados = await tentar(CSV_URL + '&t=' + Date.now());
    debug.textContent = 'OK direto • ' + dados.length + ' linhas';
    mostrar(dados);
  }catch(e1){
    debug.textContent = 'Direto falhou: ' + e1.message + ' • Tentando via proxy...';
    try{
      const dados = await tentar('https://api.allorigins.win/raw?url=' + encodeURIComponent(CSV_URL + '&t=' + Date.now()));
      debug.textContent = 'OK via proxy • ' + dados.length + ' linhas';
      mostrar(dados);
    }catch(e2){
      document.getElementById('tabela').innerHTML = '<div class="erro"><b>Erro ao carregar</b><br>Direto: ' + e1.message + '<br>Proxy: ' + e2.message + '<br><br>Confira: Arquivo > Compartilhar > Publicar na Web > aba Dashboard > CSV > Publicar</div>';
      debug.textContent = 'Falhou nos 2 caminhos';
    }
  }
}
carregar();
setInterval(carregar, 300000);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
